<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>สมุดติว DST ปี 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: colorful study app — gradient hero + subject tiles → chapter tiles → reader with sliding tabs, progress bar and callouts */
:root{
  --bg:#f4f1ff; --surface:#ffffff; --sunk:#ece8fb; --ink:#1b1640; --muted:#615b85; --line:#e2dcf7;
  --grape:#6c4cf1; --coral:#ff4f78; --sun:#ffb21e; --mint:#10b981; --sky:#1e9bf0; --pink:#e94fd1;
  --good:#0f9d6b; --warn:#d97706; --code-bg:#1d1838; --code-ink:#ece9ff;
  --shadow:0 4px 16px -8px rgb(76 50 200 / .18); --shadow-lg:0 12px 28px -12px rgb(76 50 200 / .26);
  --display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai","Sarabun",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --pop:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0c22; --surface:#1a1636; --sunk:#241f47; --ink:#f1eeff; --muted:#a9a3cc; --line:#2f2858;
  --grape:#9a82ff; --coral:#ff7896; --sun:#ffc54d; --mint:#3ddba5; --sky:#5ab8ff; --pink:#f37fe0;
  --good:#3ddba5; --warn:#ffb547; --code-bg:#0b0919; --code-ink:#ece9ff;
  --shadow:0 4px 16px -8px rgb(0 0 0 / .5); --shadow-lg:0 12px 28px -12px rgb(0 0 0 / .6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0c22; --surface:#1a1636; --sunk:#241f47; --ink:#f1eeff; --muted:#a9a3cc; --line:#2f2858;
  --grape:#9a82ff; --coral:#ff7896; --sun:#ffc54d; --mint:#3ddba5; --sky:#5ab8ff; --pink:#f37fe0;
  --good:#3ddba5; --warn:#ffb547; --code-bg:#0b0919; --code-ink:#ece9ff;
  --shadow:0 4px 16px -8px rgb(0 0 0 / .5); --shadow-lg:0 12px 28px -12px rgb(0 0 0 / .6); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;margin:0;overflow-x:hidden}
body::after{content:"";position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;opacity:.45;
  background:radial-gradient(40vmax 40vmax at 10% 0%,color-mix(in srgb,var(--grape) 18%,transparent),transparent 60%),
             radial-gradient(35vmax 35vmax at 95% 15%,color-mix(in srgb,var(--coral) 14%,transparent),transparent 60%),
             radial-gradient(40vmax 40vmax at 60% 100%,color-mix(in srgb,var(--sky) 12%,transparent),transparent 60%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--grape)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--grape);outline-offset:3px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:500;text-wrap:balance;line-height:1.3}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:19px;color:var(--ink);text-decoration:none;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--grape),var(--coral));box-shadow:0 6px 16px -6px var(--grape);transition:transform .4s var(--pop)}
.brand:hover .logo{transform:rotate(-12deg) scale(1.12)}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;min-width:0;flex:1;flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;padding:3px 10px;border-radius:999px;background:var(--sunk);transition:background .2s,color .2s}
.crumbs a:hover{background:var(--grape);color:#fff}
.crumbs span.cur{padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--grape) 16%,transparent);color:var(--grape);font-weight:600}
.readbar{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:linear-gradient(90deg,var(--grape),var(--coral),var(--sun));border-radius:0 3px 3px 0;transition:width .1s linear}
main{padding-block:26px 90px}

/* animations */
@keyframes popIn{0%{opacity:0;transform:translateY(18px) scale(.92)}70%{opacity:1}100%{opacity:1;transform:none}}
@keyframes bounceIn{0%{transform:scale(.3)}50%{transform:scale(1.15)}70%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(6deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
@keyframes shine{0%{background-position:-200% 0}100%{background-position:200% 0}}
.pop{animation:popIn .55s var(--pop) both;animation-delay:calc(var(--i,0) * 55ms)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:30px clamp(20px,4vw,40px);color:#fff;
  background:linear-gradient(125deg,#6c4cf1 0%,#8e5cf0 55%,#e9558a 120%);box-shadow:var(--shadow-lg);
  display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:center;margin-bottom:30px}
.hero .blob{position:absolute;border-radius:50%;background:rgb(255 255 255 / .1)}
.hero .b3{display:none}
.hero .b1{width:180px;height:180px;right:-40px;top:-50px}
.hero .b2{width:90px;height:90px;right:32%;bottom:-30px;animation-delay:-2s}
.hero .b3{width:50px;height:50px;left:46%;top:14px;animation-delay:-4s}
.hero > *{position:relative}
.hero .eyebrow{display:inline-block;font-size:12.5px;letter-spacing:.06em;font-weight:600;background:rgb(255 255 255 / .2);padding:4px 12px;border-radius:999px}
.hero h1{font-size:clamp(28px,4.4vw,44px);margin:12px 0 8px;font-weight:600}
.hero p{margin:0;max-width:52ch;opacity:.92}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{background:rgb(255 255 255 / .16);border:1px solid rgb(255 255 255 / .28);backdrop-filter:blur(6px);border-radius:18px;padding:14px 16px;transition:transform .35s var(--pop)}
.stat:hover{transform:translateY(-2px)}
.stat b{display:block;font-family:var(--display);font-size:34px;line-height:1.05;font-weight:600;font-variant-numeric:tabular-nums}
.stat small{font-size:13px;opacity:.9;line-height:1.4;display:block}
.stat.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;
  background:conic-gradient(#fff calc(var(--p)*1%),rgb(255 255 255 / .25) 0)}
.ring::before{content:attr(data-v);display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#8a4ff0}

/* subject shelf */
.groupLbl{display:flex;align-items:center;gap:10px;margin:28px 0 14px;font-family:var(--display);font-size:18px;font-weight:500}
.groupLbl::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--c1);box-shadow:0 0 0 4px color-mix(in srgb,var(--c1) 22%,transparent)}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:8px 22px}
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;gap:16px;margin-top:6px}
@media (max-width:1100px){.shelf{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.shelf{grid-template-columns:minmax(0,1fr);grid-auto-rows:auto}}
.shelfHead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 8px}
.shelfHead h2{margin:0;font-size:20px}
.shelfHead span{color:var(--muted);font-size:14px}
.subj .grp{margin-left:auto;align-self:flex-start;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.subj{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:22px;text-decoration:none;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .45s var(--pop),box-shadow .3s}
.subj::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.subj:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.subj:active{transform:scale(.97)}
.subj .top{display:flex;align-items:center;gap:12px}
.badge{width:48px;height:48px;border-radius:15px;flex:none;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:600;font-size:15px;
  background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 8px 18px -8px var(--c1);transition:transform .5s var(--pop)}
.subj:hover .badge{transform:scale(1.06)}
.subj .code{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--c1)}
.subj h3{margin:0;font-size:17px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:calc(2em * 1.4)}
.subj .top > div{min-width:0}
.subj .chips{flex-wrap:nowrap;overflow:hidden}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.c{background:color-mix(in srgb,var(--c1) 15%,transparent);color:var(--c1);font-weight:600}
.chip.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good);font-weight:600}
.chip.no{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn);font-weight:600}
.prog{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:auto}
.bar{height:9px;border-radius:9px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width 1s var(--pop) .3s}

/* subject page */
.subjHead{position:relative;overflow:hidden;border-radius:26px;padding:28px clamp(20px,4vw,36px);color:#fff;margin-bottom:24px;
  background:linear-gradient(125deg,var(--c1),var(--c2));box-shadow:var(--shadow-lg);display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.subjHead .blob{position:absolute;border-radius:50%;background:rgb(255 255 255 / .1)}
.subjHead .badge{width:72px;height:72px;font-size:22px;border-radius:22px;background:rgb(255 255 255 / .22);box-shadow:none;animation:bounceIn .8s var(--pop) both}
.subjHead > div{position:relative;min-width:0;flex:1}
.subjHead .eyebrow{font-size:13px;font-weight:600;opacity:.9}
.subjHead h1{margin:2px 0 6px;font-size:clamp(24px,3.6vw,34px);font-weight:600}
.subjHead p{margin:0;opacity:.92}
.chapters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:14px}
@media (max-width:1000px){.chapters{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.chapters{grid-template-columns:minmax(0,1fr);grid-auto-rows:auto}}
.chap{position:relative;display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);
  color:var(--ink);text-decoration:none;box-shadow:var(--shadow);transition:transform .45s var(--pop),box-shadow .3s,border-color .3s}
a.chap:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--c1)}
a.chap:active{transform:scale(.97)}
.chap .num{flex:none;min-width:58px;height:58px;padding:0 8px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:15px;
  color:var(--c1);background:color-mix(in srgb,var(--c1) 14%,transparent);transition:transform .5s var(--pop),background .3s,color .3s}
a.chap:hover .num{transform:scale(1.05);background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
.chap .t{min-width:0;flex:1;align-self:stretch;display:flex;flex-direction:column;font-weight:600;line-height:1.45}
.chap .t .tt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:calc(2em * 1.45);padding-right:22px}
.chap .t .chip{margin-top:auto;align-self:flex-start}
.chap .t small{color:var(--muted);font-weight:400;font-size:13.5px;line-height:1.5;margin:4px 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3em}
.chap.off{opacity:.62;box-shadow:none;border-style:dashed}
.done{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;background:var(--good);animation:bounceIn .6s var(--pop) both}

/* chapter reader */
.chapHead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tabs,.markRead,.step{height:48px}
.tabs button{height:100%;display:inline-flex;align-items:center;justify-content:center}
.markRead,.step{justify-content:center;padding-block:0}

.tabs{position:relative;display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px;box-shadow:var(--shadow)}
.tabs .ind{position:absolute;top:5px;bottom:5px;left:5px;border-radius:12px;background:linear-gradient(135deg,var(--c1),var(--c2));transition:transform .5s var(--pop),width .5s var(--pop);box-shadow:0 6px 16px -6px var(--c1)}
.tabs button{position:relative;border:0;background:transparent;padding:9px 18px;border-radius:12px;font-weight:600;color:var(--muted);transition:color .3s;white-space:nowrap}
.tabs button[aria-selected="true"]{color:#fff}
.topActs{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepNav{display:flex;gap:8px}
.step{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;font-weight:600;text-decoration:none;color:var(--c1);background:var(--surface);border:2px solid color-mix(in srgb,var(--c1) 40%,var(--line));box-shadow:var(--shadow);transition:transform .4s var(--pop),box-shadow .3s,background .3s,color .3s;white-space:nowrap}
.step.next{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--c1),var(--c2))}
a.step:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
a.step:active{transform:scale(.92)}
.step .arr{display:inline-block;transition:transform .4s var(--pop)}
a.step:hover .arr{transform:translateX(-4px)}
a.step.next:hover .arr{transform:translateX(5px)}
.step.off{opacity:.45;box-shadow:none}
.markRead{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 16px;font-weight:600;transition:transform .35s var(--pop),border-color .3s,background .3s,color .3s;position:relative}
.markRead:hover{transform:translateY(-2px)}
.markRead:active{transform:scale(.92)}
.markRead[aria-pressed="true"]{border-color:var(--good);background:var(--good);color:#fff}
.markRead .box{width:20px;height:20px;border-radius:6px;border:2px solid currentColor;display:grid;place-items:center;font-size:13px}
.spark{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:burst .7s ease-out forwards}
.reader{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:32px;align-items:start}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:10px clamp(18px,4vw,48px) 40px;box-shadow:var(--shadow);min-width:0;animation:popIn .5s var(--pop) both}
.doc > h1:first-child{font-size:clamp(23px,3.2vw,32px);margin:26px 0 8px;font-weight:600;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.doc h2{display:flex;align-items:center;gap:12px;font-size:22px;margin:44px 0 12px;scroll-margin-top:90px}
.doc h2::before{content:attr(data-n);flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 14px -6px var(--c1)}
.doc h3{font-size:17.5px;margin:28px 0 8px;scroll-margin-top:90px;color:var(--c1)}
.doc p,.doc li{max-width:74ch}
.doc ul,.doc ol{padding-left:1.4em}
.doc li{margin:4px 0}
.doc li::marker{color:var(--c1)}
.doc hr{border:0;height:2px;margin:30px 0;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.doc strong{font-weight:700}
.doc blockquote{margin:16px 0;padding:12px 16px 12px 52px;border-radius:16px;position:relative;max-width:74ch;
  background:color-mix(in srgb,var(--sky) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--sky) 30%,transparent);transition:transform .35s var(--pop)}

.doc blockquote::before{content:"i";position:absolute;left:14px;top:13px;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;background:var(--sky)}
.doc blockquote p{margin:4px 0}
.doc blockquote.warn{background:color-mix(in srgb,var(--sun) 15%,var(--surface));border-color:color-mix(in srgb,var(--sun) 45%,transparent)}
.doc blockquote.warn::before{content:"!";background:var(--sun)}
.doc blockquote.key{background:color-mix(in srgb,var(--grape) 12%,var(--surface));border-color:color-mix(in srgb,var(--grape) 35%,transparent)}
.doc blockquote.key::before{content:"★";background:var(--grape)}
.doc blockquote.hot{background:color-mix(in srgb,var(--coral) 12%,var(--surface));border-color:color-mix(in srgb,var(--coral) 35%,transparent)}
.doc blockquote.hot::before{content:"✦";background:var(--coral)}
.doc blockquote.def{background:color-mix(in srgb,var(--mint) 12%,var(--surface));border-color:color-mix(in srgb,var(--mint) 35%,transparent)}
.doc blockquote.def::before{content:"≡";background:var(--mint)}
.doc code{font-family:var(--mono);font-size:.86em;background:color-mix(in srgb,var(--grape) 11%,transparent);color:var(--ink);border-radius:6px;padding:.1em .38em}
.doc pre{position:relative;background:var(--code-bg);color:var(--code-ink);border-radius:16px;padding:18px 18px 16px;overflow-x:auto;line-height:1.6;font-size:13.8px;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .06)}
.doc pre code{background:none;color:inherit;padding:0;font-size:inherit}
.doc pre .copy{position:absolute;top:8px;right:8px;border:0;background:rgb(255 255 255 / .1);color:#fff;font-size:12px;padding:4px 10px;border-radius:8px;opacity:0;transition:opacity .2s,transform .3s var(--pop)}
.doc pre:hover .copy,.doc pre .copy:focus-visible{opacity:1}
.doc pre .copy:active{transform:scale(.85)}
.tbl{overflow-x:auto;margin:16px 0;border-radius:14px;border:1px solid var(--line)}
.doc table{border-collapse:collapse;font-size:14.5px;min-width:100%}
.doc th,.doc td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.doc th{background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 16%,var(--surface)),color-mix(in srgb,var(--c2) 12%,var(--surface)));font-weight:700;white-space:nowrap}
.doc tr:last-child td{border-bottom:0}
.doc tbody tr{transition:background .2s}
.doc tbody tr:hover{background:color-mix(in srgb,var(--c1) 6%,transparent)}
.doc li:has(> input[type=checkbox]){list-style:none;margin-left:-1.4em}
.doc input[type=checkbox]{width:18px;height:18px;margin-right:9px;vertical-align:-3px;accent-color:var(--good);cursor:pointer;transition:transform .3s var(--pop)}
.doc input[type=checkbox]:checked{animation:bounceIn .45s var(--pop)}
.doc li:has(> input:checked){color:var(--muted);text-decoration:line-through;text-decoration-color:var(--good)}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .6s var(--pop)}
.reveal.in{opacity:1;transform:none}
.toc{position:sticky;top:84px;max-height:calc(100vh - 110px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);font-size:14px}

.pager{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;margin-top:20px}
.pager a{display:flex;flex-direction:column;justify-content:center;min-height:76px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 18px;text-decoration:none;color:var(--ink);font-weight:600;box-shadow:var(--shadow);transition:transform .4s var(--pop),border-color .3s}

.pager a small{display:block;color:var(--c1);font-weight:600}
.pager a.next{text-align:right}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:52px;height:52px;border-radius:18px;border:0;color:#fff;font-size:22px;
  background:linear-gradient(135deg,var(--grape),var(--coral));box-shadow:var(--shadow-lg);transform:scale(0);transition:transform .45s var(--pop)}

.fab:hover{transform:scale(1.1) rotate(-8deg)}
.quiz{display:flex;flex-direction:column;gap:16px;max-width:860px}
.qbar{position:sticky;top:72px;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow)}
.qbar .meter{flex:1;min-width:120px;height:10px;border-radius:10px;background:var(--sunk);overflow:hidden}
.qbar .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .5s var(--pop)}
.qbar b{font-family:var(--display);font-weight:500;font-variant-numeric:tabular-nums}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px clamp(16px,3vw,26px);box-shadow:var(--shadow)}
.qcard .qn{font-size:13px;font-weight:700;color:var(--c1);margin-bottom:4px}
.qcard .qt{font-weight:600;font-size:16.5px;margin:0 0 12px}
.qcard pre{background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;transition:transform .3s var(--pop),border-color .2s,background .2s}
.opt:hover:not([disabled]){border-color:var(--c1);transform:translateX(3px)}

.opt .k{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--sunk);color:var(--muted)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 10%,var(--surface));animation:shake .4s}

@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.65;animation:popIn .4s var(--pop) both}
.fb.ok{background:color-mix(in srgb,var(--good) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--good) 35%,transparent)}
.fb.no{background:color-mix(in srgb,var(--coral) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--coral) 35%,transparent)}

.fb .ans{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.result{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow);animation:popIn .5s var(--pop) both}
.result .big{font-family:var(--display);font-size:44px;line-height:1.1;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.result button{margin-top:12px;border:0;color:#fff;font-weight:600;padding:10px 20px;border-radius:14px;background:linear-gradient(135deg,var(--c1),var(--c2));transition:transform .3s var(--pop)}

/* tools in header */
.tools{display:flex;gap:6px;align-items:center;margin-left:auto}

a.task:hover{border-color:var(--grape);transform:translateY(-2px)}

/* page heads for tools */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}

/* search */

/* timer */

async function load(path){
  if (cache[path]) return cache[path];
  const r = await fetch(path);
  if (!r.ok) throw new Error(r.status);
  return (cache[path] = await r.text());
}

function sparkle(btn){
  if (reduce) return;
  const cols = ["var(--grape)","var(--coral)","var(--sun)","var(--mint)","var(--sky)","var(--pink)"];
  for (let k = 0; k < 10; k++){
    const s = document.createElement("span"); s.className = "spark";
    const a = (k / 10) * Math.PI * 2, r = 40 + Math.random() * 30;
    s.style.setProperty("--dx", Math.cos(a) * r + "px"); s.style.setProperty("--dy", Math.sin(a) * r + "px");
    s.style.background = cols[k % cols.length];
    btn.appendChild(s); setTimeout(() => s.remove(), 750);
  }
}

function renderQuiz(qs, c, s, opts = {}){
  const box = document.getElementById("quiz");
  if (!qs.length){ box.innerHTML = opts.empty || `<div class="empty"><div class="ico">📝</div><p>บทนี้ยังไม่มีแบบฝึกหัด</p></div>`; return; }
  const K = ["ก","ข","ค","ง","จ"], best = store.get("dst-best", {}), track = !opts.nobest;
  let done = 0, score = 0;
  box.innerHTML = `<div class="qbar"><span>ทำแล้ว <b id="qd">0</b>/${qs.length}</span><span class="meter"><i id="qm"></i></span><span>ถูก <b id="qs">0</b> ข้อ</span>${track && best[c.id] != null ? `<span class="chip c">สถิติดีสุด ${best[c.id]}/${qs.length}</span>` : ""}</div>` +
    qs.map((q, i) => `<div class="qcard pop" style="--i:${Math.min(i, 8)};${q.cv || ""}" data-i="${i}"><div class="qn">${q.srcLabel ? `<a class="src" href="#${q.srcId}">${esc(q.srcLabel)}</a> · ` : ""}ข้อ ${i + 1}</div><p class="qt">${esc(q.q)}</p>
      ${q.code ? `<pre>${esc(q.code)}</pre>` : ""}
      <div class="opts">${q.c.map((o, j) => `<button class="opt" data-j="${j}"><span class="k">${K[j]}</span><span>${esc(o)}</span></button>`).join("")}</div></div>`).join("") +
    `<div id="qres"></div>`;
  box.querySelectorAll(".qcard").forEach(card => {
    const q = qs[+card.dataset.i];
    card.querySelectorAll(".opt").forEach(btn => btn.onclick = () => {
      const j = +btn.dataset.j, ok = j === q.a;
      card.querySelectorAll(".opt").forEach((b, n) => { b.disabled = true; if (n === q.a) b.classList.add("right"); else if (n === j) b.classList.add("wrong"); else b.classList.add("dim"); });
      const fb = document.createElement("div");
      fb.className = "fb " + (ok ? "ok" : "no");
      fb.innerHTML = ok
        ? `<p class="h">✓ ถูกต้อง!${opts.nobest ? " เอาออกจากสมุดข้อที่ผิดแล้ว" : ""}</p><p>${esc(q.why[q.a])}</p>`
        : `<p class="h">✗ ยังไม่ถูก คุณเลือกข้อ ${K[j]}</p><p><b>ทำไมข้อ ${K[j]} ผิด:</b> ${esc(q.why[j])}</p>
           <div class="ans"><p><b>เฉลย: ข้อ ${K[q.a]}. ${esc(q.c[q.a])}</b></p><p>${esc(q.why[q.a])}</p></div>`;
      card.appendChild(fb);
      setWrong(q.key, !ok); markDay();
      done++; if (ok) score++;
      document.getElementById("qd").textContent = done; document.getElementById("qs").textContent = score;
      document.getElementById("qm").style.width = (done / qs.length * 100) + "%";
      if (done === qs.length){
        if (track && (best[c.id] == null || score > best[c.id])){ best[c.id] = score; store.set("dst-best", best); }
        const pct = Math.round(score / qs.length * 100);
        const msg = pct === 100 ? "เต็ม! เก่งมาก" : pct >= 70 ? "ดีมาก ข้อที่ผิดเก็บไว้ในสมุดข้อที่ผิดแล้ว" : "ข้อที่ผิดเก็บไว้ในสมุดข้อที่ผิดแล้ว ลองอ่านสรุปแล้วกลับมาทำใหม่";
        const res = document.getElementById("qres");
        res.innerHTML = `<div class="result"><div class="big">${score}/${qs.length}</div><p>${msg}</p><button id="retry">ทำใหม่อีกรอบ</button></div>`;
        document.getElementById("retry").onclick = () => opts.again ? opts.again() : renderQuiz(qs, c, s, opts);
        res.scrollIntoView({behavior: reduce ? "auto" : "smooth", block: "center"});
      }
    });
  });
}

let sIndex = null;
async function buildIndex(){
  if (sIndex) return sIndex;
  const out = [];
  const jobs = [];
  for (const s of SUBJECTS) for (const c of s.chapters) if (c.st === "ready")
    jobs.push(load(`content/${c.id}.md`).then(md => {
      let sec = "", buf = [];
      const flush = () => { if (buf.length) out.push({s, c, sec, text: buf.join(" ").replace(/[`*#>|_]/g, " ").replace(/\s+/g, " ")}); buf = []; };
      md.split("\n").forEach(line => { if (/^##\s/.test(line)){ flush(); sec = line.replace(/^##\s+/, ""); } else buf.push(line); });
      flush();
    }).catch(() => {}));
  await Promise.all(jobs);
  return (sIndex = out);
}

function renderSearch(){
  setCrumbs([{t:"ค้นหา"}]);
  app.innerHTML = `<div class="phead"><div><h1>ค้นหา</h1><p>พิมพ์คำที่อยากหา เช่น JWT, VLSM, cohesion, cron</p></div></div>
    <div class="sbox"><input id="q" type="search" placeholder="ค้นหาในทุกบท…" autocomplete="off" aria-label="ค้นหา"></div><div class="hits" id="hits"></div>`;
  const inp = document.getElementById("q"), hits = document.getElementById("hits");
  let saved = ""; try{ saved = sessionStorage.getItem("dst-q") || ""; }catch(e){}
  inp.value = saved; inp.focus();
  const run = async () => {
    const q = inp.value.trim(); try{ sessionStorage.setItem("dst-q", q); }catch(e){}
    if (q.length < 2){ hits.innerHTML = `<div class="empty"><div class="ico">⌕</div><p>พิมพ์อย่างน้อย 2 ตัวอักษร</p></div>`; return; }
    hits.innerHTML = `<div class="loading"><i></i><i></i><i></i></div>`;
    const idx = await buildIndex(), ql = q.toLowerCase();
    const found = idx.filter(r => (r.sec + " " + r.text).toLowerCase().includes(ql)).slice(0, 40);
    if (!found.length){ hits.innerHTML = `<div class="empty"><div class="ico">🤔</div><p>ไม่พบ "${esc(q)}" ลองคำอื่นหรือสะกดภาษาอังกฤษ</p></div>`; return; }
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig");
    hits.innerHTML = found.map((r, i) => {
      const pos = r.text.toLowerCase().indexOf(ql), a = Math.max(0, pos - 60);
      const snip = pos >= 0 ? (a ? "…" : "") + r.text.slice(a, a + 180) + "…" : r.text.slice(0, 160) + "…";
      return `<a class="hit pop" style="${cv(r.s)};--i:${Math.min(i, 8)}" href="#${r.c.id}" data-sec="${esc(r.sec)}"><div class="where">${r.s.code} · ${r.c.num} ${esc(r.c.title)}</div>
        <div class="sec">${esc(r.sec).replace(re, m => `<mark>${m}</mark>`)}</div><div class="snip">${esc(snip).replace(re, m => `<mark>${m}</mark>`)}</div></a>`;
    }).join("");
    hits.querySelectorAll(".hit").forEach(h => h.onclick = () => { pendingSec = h.dataset.sec; });
  };
  let t; inp.oninput = () => { clearTimeout(t); t = setTimeout(run, 220); };
  if (saved) run();
}

addEventListener("keydown", e => {
  if (location.hash !== "#cards" || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowRight") document.getElementById("fnext")?.click();
  else if (e.key === "ArrowLeft") document.getElementById("fprev")?.click();
  else if (e.key === " "){ e.preventDefault(); document.getElementById("fcard")?.classList.toggle("turn"); }
});

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let examTimer = null;
async function examPool(ids){
  const pool = [];
  for (const id of ids){
    const s = SUBJECTS.find(x => x.id === id); let all;
    try{ all = await loadQuiz(id); }catch(e){ continue; }
    for (const [cid, list] of Object.entries(all)){
      const c = s.chapters.find(x => x.id === cid);
      list.forEach((q, i) => pool.push({...q, key: cid + ":" + i, cid, srcId: cid + "-quick", srcLabel: `${s.code} ${c ? c.num : ""}`, chTitle: c ? c.title : cid, cv: cv(s), s}));
    }
  }
  return pool;
}

function startExam(qs, mins, subIds){
  const K = ["ก","ข","ค","ง","จ"], ans = new Array(qs.length).fill(null);
  const end = Date.now() + mins * 60000, t0 = Date.now();
  let armed = false, finished = false;
  app.innerHTML = `<div class="phead"><div><h1>ข้อสอบจำลอง</h1><p>${qs.length} ข้อ · ${mins} นาที · เปลี่ยนคำตอบได้จนกว่าจะกดส่ง</p></div></div>
    <div class="examBar"><span class="clk" id="eclk">${fmt(mins * 60)}</span><span class="meter"><i id="em"></i></span><span>ตอบแล้ว <b id="ed">0</b>/${qs.length}</span><button class="btn pri" id="esub" style="height:38px">ส่งข้อสอบ</button><p class="warnTx" id="ewarn" hidden></p></div>
    <div class="quiz" id="quiz" style="--c1:var(--grape);--c2:var(--coral);max-width:none">${qs.map((q, i) => `<div class="qcard" style="${q.cv}" data-i="${i}"><div class="qn">ข้อ ${i + 1} · ${esc(q.srcLabel)}</div><p class="qt">${esc(q.q)}</p>
      ${q.code ? `<pre>${esc(q.code)}</pre>` : ""}<div class="opts">${q.c.map((o, j) => `<button class="opt" data-j="${j}"><span class="k">${K[j]}</span><span>${esc(o)}</span></button>`).join("")}</div></div>`).join("")}</div>
    <div id="eres"></div>`;
  const bar = document.querySelector(".examBar"), hdr = document.querySelector("header.top"); bar.style.top = (hdr.offsetHeight + 8) + "px";
  const ed = document.getElementById("ed"), em = document.getElementById("em"), clk = document.getElementById("eclk"), warn = document.getElementById("ewarn"), sub = document.getElementById("esub");
  app.querySelectorAll(".qcard").forEach(card => {
    const i = +card.dataset.i;
    card.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (finished) return;
      ans[i] = +b.dataset.j;
      card.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", x === b));
      const done = ans.filter(a => a !== null).length;
      ed.textContent = done; em.style.width = (done / qs.length * 100) + "%";
      if (armed){ armed = false; warn.hidden = true; sub.textContent = "ส่งข้อสอบ"; }
    });
  });
  const tickE = () => {
    if (location.hash !== "#exam"){ clearInterval(examTimer); return; }
    const left = Math.max(0, Math.round((end - Date.now()) / 1000));
    clk.textContent = fmt(left); clk.classList.toggle("low", left <= 60);
    if (left === 0) finish(true);
  };
  clearInterval(examTimer); examTimer = setInterval(tickE, 500);
  sub.onclick = () => {
    const blank = ans.filter(a => a === null).length;
    if (blank && !armed){ armed = true; warn.hidden = false; warn.textContent = `ยังไม่ได้ตอบ ${blank} ข้อ กด "ส่งเลย" อีกครั้งถ้าจะส่งตอนนี้`; sub.textContent = "ส่งเลย"; return; }
    finish(false);
  };
  function finish(timeout){
    if (finished) return; finished = true; clearInterval(examTimer);
    let score = 0; const by = {};
    qs.forEach((q, i) => {
      const a = ans[i], ok = a === q.a; if (ok) score++;
      const b = by[q.cid] || (by[q.cid] = {q, n:0, ok:0}); b.n++; if (ok) b.ok++;
      setWrong(q.key, !ok);
      const card = app.querySelector(`.qcard[data-i="${i}"]`);
      card.querySelectorAll(".opt").forEach((x, j) => { x.disabled = true; x.classList.remove("sel"); if (j === q.a) x.classList.add("right"); else if (j === a) x.classList.add("wrong"); else x.classList.add("dim"); });
      const fb = document.createElement("div"); fb.className = "fb " + (ok ? "ok" : "no");
      fb.innerHTML = ok ? `<p class="h">✓ ถูก</p><p>${esc(q.why[q.a])}</p>`
        : (a === null ? `<p class="h">— ไม่ได้ตอบ</p>` : `<p class="h">✗ คุณเลือกข้อ ${K[a]}</p><p><b>ทำไมข้อ ${K[a]} ผิด:</b> ${esc(q.why[a])}</p>`) +
          `<div class="ans"><p><b>เฉลย: ข้อ ${K[q.a]}. ${esc(q.c[q.a])}</b></p><p>${esc(q.why[q.a])}</p></div>`;
      card.appendChild(fb);
    });
    markDay();
    const used = Math.round((Date.now() - t0) / 1000), pct = Math.round(score / qs.length * 100);
    const names = subIds.map(id => SUBJECTS.find(s => s.id === id).short).join(", ");
    const hist = store.get("dst-exam-hist", []);
    hist.unshift({d: new Date().toLocaleDateString("th-TH", {day:"numeric", month:"short"}) + " " + new Date().toLocaleTimeString("th-TH", {hour:"2-digit", minute:"2-digit"}), sc: score, n: qs.length, subs: names});
    store.set("dst-exam-hist", hist.slice(0, 10));
    const rows = Object.values(by).sort((x, y) => x.ok / x.n - y.ok / y.n);
    document.querySelector(".examBar").remove();
    const res = document.getElementById("eres");
    app.querySelector(".phead").insertAdjacentHTML("afterend", `<div class="result" style="--c1:var(--grape);--c2:var(--coral);margin-bottom:18px">
      <div class="big">${score}/${qs.length}</div><p>${timeout ? "หมดเวลา ระบบส่งให้อัตโนมัติ · " : ""}${pct}% · ใช้เวลา ${fmt(used)} นาที</p>
      <div class="bdown">${rows.map(r => `<div class="brow" style="${r.q.cv}"><span class="nm">${esc(r.q.srcLabel)} ${esc(r.q.chTitle)}</span><b>${r.ok}/${r.n}</b><span class="bar"><i style="width:${r.ok / r.n * 100}%"></i></span>${r.ok < r.n ? `<a href="#${r.q.cid}-quick">ทวนบทนี้ →</a>` : `<span class="chip ok">ผ่าน</span>`}</div>`).join("")}</div>
      <p class="note" style="color:var(--muted);font-size:14px">ข้อที่ผิดหรือไม่ได้ตอบถูกเก็บไว้ในสมุดข้อที่ผิดแล้ว · เฉลยทุกข้ออยู่ด้านล่าง</p>
      <div class="resBtns"><button class="btn pri" id="eagain">ทำชุดใหม่</button><a class="btn" href="#wrong" style="text-decoration:none;color:inherit">ไปสมุดข้อที่ผิด</a></div></div>`);
    document.getElementById("eagain").onclick = renderExam;
    scrollTo({top:0, behavior: reduce ? "auto" : "smooth"});
  }
  scrollTo(0, 0);
}

/* ---------- network calculation drill ---------- */
const ipI = a => a.split(".").reduce((n, x) => n * 256 + +x, 0);
const ipS = n => [24, 16, 8, 0].map(b => Math.floor(n / 2 ** b) % 256).join(".");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const maskOf = pf => ipS(2 ** 32 - 2 ** (32 - pf));
function genFrag(){
  const mtu = pick([1500, 1000, 1200, 820, 620, 576, 1400, 1100]);
  const raw = mtu - 20, max = Math.floor(raw / 8) * 8;
  let data = rnd(max + 50, max * 4 - 30); if (data % max === 0) data += 24;
  const total = Math.random() < .4;
  const n = Math.ceil(data / max), rows = [];
  for (let i = 0, st = 0; i < n; i++, st += max){ const d = Math.min(max, data - st); rows.push({name:`ชิ้น ${i + 1}`, cells:[d, d + 20, i < n - 1 ? 1 : 0, st / 8], st, d}); }
  const text = total ? `IP datagram ขนาด <b>${data + 20} bytes</b> (รวม IP header 20 bytes) ต้องส่งผ่าน link ที่มี <b>MTU = ${mtu} bytes</b>` : `ต้องส่ง <b>Data payload ${data} bytes</b> ผ่าน link ที่มี <b>MTU = ${mtu} bytes</b> (IP header 20 bytes)`;
  return {text: text + " จงหาค่าต่อไปนี้",
    singles:[{label:"Max data ต่อ 1 fragment (bytes)", ans:max}, {label:"จำนวน fragment", ans:n}],
    table:{cols:["Data (bytes)", "Total Length", "MF", "Offset"], rows},
    steps:[ total ? `data จริง = ${data + 20} − 20 = <b>${data}</b> bytes` : `data ทั้งหมด = <b>${data}</b> bytes`,
      `Max data = ${mtu} − 20 = ${raw} → ${raw} / 8 = ${+(raw / 8).toFixed(3)}${raw % 8 ? ` ไม่ลงตัว → ปัดลง ${Math.floor(raw / 8)} × 8 = <b>${max}</b>` : ` ลงตัว → <b>${max}</b>`}`,
      `จำนวน fragment = ceil(${data} / ${max}) = <b>${n}</b>`,
      ...rows.map((r, i) => `${r.name}: byte ${r.st}–${r.st + r.d - 1} · data ${r.d} · total ${r.d} + 20 = ${r.d + 20} · MF ${r.cells[2]} · offset ${r.st}/8 = <b>${r.st / 8}</b>`)]};
}
function genSubnet(){
  const pf = pick([24, 25, 26, 26, 27, 27, 28, 28, 29, 30]);
  const base = pick([[192, 168, rnd(0, 50)], [10, rnd(0, 30), rnd(0, 255)], [172, 16, rnd(0, 31)]]);
  const ip = ipS(ipI(base.join(".") + "." + rnd(1, 254)));
  const blk = 2 ** (32 - pf), last = ipI(ip) % 256, net = Math.floor(last / blk) * blk, pre = base.join(".") + ".";
  return {text:`IP Address <b>${ip}/${pf}</b> จงหาค่าต่อไปนี้`,
    singles:[{label:"Subnet mask", ans:maskOf(pf)}, {label:"Block size (IP ทั้งหมดในวง)", ans:blk}, {label:"จำนวน IP ที่แจกได้", ans:blk - 2},
      {label:"Network address", ans:pre + net}, {label:"First usable IP", ans:pre + (net + 1)}, {label:"Last usable IP", ans:pre + (net + blk - 2)}, {label:"Broadcast address", ans:pre + (net + blk - 1)}],
    steps:[`Block = 2^(32 − ${pf}) = 2^${32 - pf} = <b>${blk}</b> · แจกได้ ${blk} − 2 = <b>${blk - 2}</b>`,
      `Mask octet ท้าย = 256 − ${blk} = ${256 - blk} → <b>${maskOf(pf)}</b>`,
      `ดู octet ท้าย .${last}: floor(${last} / ${blk}) × ${blk} = ${Math.floor(last / blk)} × ${blk} = <b>${net}</b> → Network ${pre}${net}`,
      `Broadcast = ${net} + ${blk} − 1 = <b>${net + blk - 1}</b> → ${pre}${net + blk - 1}`,
      `Usable = ${pre}${net + 1} – ${pre}${net + blk - 2}`]};
}
function genDivide(){
  const pf = pick([25, 26, 26, 27]), pre = `192.168.${rnd(0, 60)}.`, blk = 2 ** (32 - pf), n = 256 / blk;
  const rows = []; for (let i = 0; i < n; i++){ const nt = i * blk; rows.push({name:`วง ${i + 1}`, cells:[pre + nt, pre + (nt + 1), pre + (nt + blk - 2), pre + (nt + blk - 1)]}); }
  return {text:`ต้องการแบ่งเครือข่าย <b>${pre}0/24</b> เป็นวงย่อยขนาด <b>/${pf}</b> เท่าๆ กัน จงหาค่าต่อไปนี้`,
    singles:[{label:"Subnet mask ของวงย่อย", ans:maskOf(pf)}, {label:"Block size", ans:blk}, {label:"จำนวนวง (subnets)", ans:n}],
    table:{cols:["Network", "First usable", "Last usable", "Broadcast"], rows},
    steps:[`Block = 2^(32 − ${pf}) = <b>${blk}</b> · Mask = 256 − ${blk} = ${256 - blk} → ${maskOf(pf)}`, `จำนวนวง = 256 / ${blk} = <b>${n}</b>`,
      `แต่ละวงเริ่มที่ผลคูณของ ${blk}: ${rows.map((r, i) => i * blk).join(", ")}`, `Broadcast ของแต่ละวง = วงถัดไป − 1 · Usable = Network + 1 ถึง Broadcast − 1`]};
}
function genVlsm(){
  const pre = pick([`10.${rnd(0, 99)}.${rnd(0, 99)}.`, `192.168.${rnd(0, 60)}.`, `172.16.${rnd(0, 31)}.`]);
  const sets = [[128, 32, 8], [128, 64], [128, 64, 32], [64, 32, 16], [128, 32, 16], [64, 64, 32], [128, 64, 32, 16], [64, 32, 16, 4], [128, 32, 8, 4], [32, 16, 8]];
  const sizes = pick(sets), names = shuffle(["Nurse", "Doctor", "Pharmacy", "Lab", "Admin", "Finance", "IT", "Reception", "X-Ray"]);
  const depts = sizes.map((z, i) => ({name: names[i], vlan: (i + 1) * 10, z, h: z === 4 ? 2 : (Math.random() < .3 ? z - 2 : rnd(z / 2 - 1, z - 2))}));
  let cur = 0;
  const sorted = depts.slice().sort((a, b) => b.z - a.z);
  sorted.forEach(d => { d.nt = cur; cur += d.z; d.pf = 32 - Math.log2(d.z); });
  const rows = sorted.map(d => ({name:`VLAN ${d.vlan} ${d.name}`, cells:["/" + d.pf, maskOf(d.pf), pre + d.nt, `${pre}${d.nt + 1} - ${pre}${d.nt + d.z - 2}`, pre + (d.nt + d.z - 1), pre + (d.nt + 1)]}));
  const tgt = pick(depts), ipx = pre + rnd(tgt.nt + 1, tgt.nt + tgt.z - 2);
  const free = cur < 256 ? `${pre}${cur} - ${pre}255` : "ไม่เหลือ";
  return {text:`ได้รับวง IP <b>${pre}0/24</b> ต้องแบ่งให้ ${depts.length} หน่วยงานแบบ <b>VLSM</b> ให้ประหยัดที่สุด และกำหนดให้ <b>IP ใช้งานได้ตัวแรกเป็น Default Gateway</b><br>${depts.map(d => `VLAN ${d.vlan} ${d.name}: <b>${d.h} เครื่อง</b>`).join(" · ")}<br><span style="color:var(--muted);font-size:14px">ตารางเรียงจากหน่วยงานที่ต้องการมากไปน้อยให้แล้ว · Usable Range พิมพ์แบบ <code>${pre}1 - ${pre}126</code></span>`,
    table:{cols:["Prefix", "Subnet Mask", "Network", "Usable Range", "Broadcast", "Gateway"], rows},
    after:[{label:`IP ${ipx} อยู่ VLAN ไหน`, ans:tgt.vlan}, {label:"IP ที่ยังว่างหลังแบ่งครบ", ans:free}],
    steps:[`เรียงมากไปน้อย: ${sorted.map(d => `VLAN ${d.vlan} (${d.h})`).join(" → ")}`,
      ...sorted.map(d => `VLAN ${d.vlan}: ${d.h} + 2 = ${d.h + 2} → 2^${Math.log2(d.z)} = ${d.z}${d.h + 2 === d.z ? " (พอดี)" : ""} → <b>/${d.pf}</b> · mask ${maskOf(d.pf)} · network .${d.nt} · usable .${d.nt + 1} – .${d.nt + d.z - 2} · broadcast <b>.${d.nt + d.z - 1}</b> · gateway .${d.nt + 1}`),
      `IP ${ipx}: ดู octet ท้ายว่าตกอยู่ในช่วงไหน → อยู่ช่วง .${tgt.nt} – .${tgt.nt + tgt.z - 1} = <b>VLAN ${tgt.vlan}</b>`,
      cur < 256 ? `ใช้ไปถึง .${cur - 1} → ที่ว่าง <b>${free}</b> (${256 - cur} เบอร์)` : `ใช้ครบทั้ง /24 ไม่เหลือที่ว่าง`]};
}
const CALC = [["frag", "Fragmentation", genFrag], ["subnet", "IP อยู่วงไหน", genSubnet], ["divide", "แบ่ง Subnet", genDivide], ["vlsm", "VLSM + VLAN (แนวข้อสอบ)", genVlsm]];

const LIBS = {h2c:"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js", jspdf:"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"};
const loadScript = src => new Promise((ok, no) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = () => no(new Error("load " + src)); document.head.appendChild(el); });

/* ---------- exam paper (VLSM + VLAN, printable) ---------- */
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function genPaper(code){
  const r = mulberry(code * 7919 + 13), ri = (a, b) => a + Math.floor(r() * (b - a + 1)), pk = a => a[Math.floor(r() * a.length)];
  const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const scen = pk([["โรงพยาบาลแห่งหนึ่ง", ["Nurse", "Doctor", "Pharmacy", "Lab", "X-Ray", "Admin"]], ["มหาวิทยาลัยแห่งหนึ่ง", ["Student", "Lecturer", "Staff", "Library", "Lab", "Registrar"]],
    ["บริษัทแห่งหนึ่ง", ["Sales", "IT", "HR", "Finance", "Marketing", "Admin"]], ["โรงแรมแห่งหนึ่ง", ["Front Desk", "Housekeeping", "Kitchen", "Security", "Manager", "Spa"]], ["โรงเรียนแห่งหนึ่ง", ["Classroom", "Teacher", "Office", "Library", "Lab", "Canteen"]]]);
  const pre = pk([`10.${ri(1, 99)}.${ri(0, 99)}.`, `192.168.${ri(0, 99)}.`, `172.${ri(16, 31)}.${ri(0, 99)}.`]);
  const sizes = pk([[128, 32, 8], [128, 64, 16], [128, 32, 16], [64, 32, 8], [64, 32, 16], [128, 64, 32], [64, 64, 16], [128, 16, 8], [64, 32, 16, 8], [128, 32, 16, 4]]);
  const names = shuf(scen[1]);
  const hostOf = z => z === 4 ? 2 : (r() < .35 ? z - 2 : ri(z / 2 - 1, z - 3));
  let depts = sizes.map((z, i) => ({name: names[i], z, h: hostOf(z)}));
  const shuffled = r() < .3; if (shuffled) depts = shuf(depts);
  depts.forEach((d, i) => d.vlan = (i + 1) * 10);
  let cur = 0;
  depts.slice().sort((a, b) => b.z - a.z || a.vlan - b.vlan).forEach(d => { d.nt = cur; cur += d.z; d.pf = 32 - Math.log2(d.z); });
  const tgt = pk(depts), ip = pre + ri(tgt.nt + 1, tgt.nt + tgt.z - 2);
  return {code, scen: scen[0], pre, depts, ip, tgt, cur, shuffled};
}
function paperHTML(P, showAns){
  const d = P.depts, full = d.length * 2 + 4;
  return `<article class="paper${showAns ? " showAns" : ""}">

    <p class="q">2. เครื่องที่ใช้ IP ${P.ip} อยู่ในวง VLAN ตัวใด</p>

    <div class="dots"><span class="ans">${P.cur < 256 ? `${P.pre}${P.cur} – ${P.pre}255` : "ไม่เหลือ"}</span></div>
    <div class="key"><b>วิธีคิด (ชุดที่ ${P.code})</b><br>
      ${P.shuffled ? "⚠️ ชุดนี้ VLAN ไม่ได้เรียงตามขนาด ต้อง<b>จัดสรรจากหน่วยงานที่ต้องการมากที่สุดก่อน</b> ไม่ใช่ตามเลข VLAN<br>" : ""}
      ${d.slice().sort((a, b) => a.nt - b.nt).map(x => `VLAN ${x.vlan} ${esc(x.name)}: ${x.h} + 2 = ${x.h + 2} → 2^${Math.log2(x.z)} = ${x.z}${x.h + 2 === x.z ? " (พอดี)" : ""} → <b>/${x.pf}</b> · เริ่ม .${x.nt} · broadcast ${x.nt} + ${x.z} − 1 = <b>.${x.nt + x.z - 1}</b>`).join("<br>")}<br>
      ข้อ 2: .${P.ip.split(".")[3]} อยู่ในช่วง .${P.tgt.nt} – .${P.tgt.nt + P.tgt.z - 1} → <b>VLAN ${P.tgt.vlan}</b><br>
      ข้อ 3: ใช้ไปถึง .${P.cur - 1} → ว่าง <b>.${P.cur} – .255</b> (${256 - P.cur} เบอร์)<br>
      <span style="color:#777">คะแนน: ข้อ 1 แถวละ 2 · ข้อ 2 = 2 · ข้อ 3 = 2</span></div>

}

/* ---------- guided tutorial (VLSM + VLAN) ---------- */
function buildLesson(P){
  const pre = P.pre, d = P.depts, sorted = d.slice().sort((a, b) => a.nt - b.nt), last = ip => ip.split(".")[3];
  const pows = [4, 8, 16, 32, 64, 128, 256];
  const S = [];
  S.push({tag:"เริ่ม", title:"อ่านโจทย์และวางแผน", body:`<p>เราได้วง <b>${pre}0/24</b> = มี IP ให้ใช้ <b>256 ตัว</b> (.0 ถึง .255) ต้องแบ่งให้ ${d.length} หน่วยงานแบบ <b>VLSM</b> คือให้แต่ละวงมีขนาดพอดีที่สุด ไม่เปลือง</p>
    <p>เราจะทำ 4 ขั้น:</p><p>① หาขนาดวงของทุก VLAN (+2 → 2ⁿ → prefix → mask)<br>② เรียงว่าใครได้ก่อน (ใหญ่ไปเล็ก)<br>③ ไล่หา network, broadcast, gateway ทีละวง<br>④ ตอบข้อ 2 และข้อ 3</p>`});
  d.forEach(x => {
    const n = Math.log2(x.z), need = x.h + 2;
    S.push({tag:`① ขนาดวง · VLAN ${x.vlan}`, title:`VLAN ${x.vlan} ${esc(x.name)} ต้องการ ${x.h} เครื่อง ต้องใช้ IP กี่ตัว`, body:`<p>ทุกวงจะเสีย IP ไป 2 ตัวที่แจกให้เครื่องไม่ได้เสมอ คือ <b>Network</b> (ตัวแรก = ชื่อวง) และ <b>Broadcast</b> (ตัวสุดท้าย = ส่งหาทุกเครื่อง)</p><p>เลยต้องเอาจำนวนเครื่อง <b>+ 2</b></p>`,
      ask:`${x.h} + 2 = ?`, ans:need, cell:[x.vlan, "need"], ok:`${x.h} + 2 = <b>${need}</b> IP`});
    S.push({tag:`① ขนาดวง · VLAN ${x.vlan}`, title:`ขนาดวง (block size) ต้องเป็น 2ⁿ ที่ ≥ ${need}`, body:`<p>วงย่อยมีขนาดได้แค่เลขยกกำลังของ 2: <code>${pows.join(", ")}</code></p><p>ให้เลือก<b>ตัวที่เล็กที่สุดที่ยังพอ</b> (≥ ${need}) จะได้ไม่เปลือง</p>`,
      ask:`ขนาดวงของ VLAN ${x.vlan} = ?`, ans:x.z, cell:[x.vlan, "z"], hint:`ไล่ดู: ${pows.filter(v => v <= x.z).map(v => v >= need ? `<b>${v} ✓ พอแล้ว</b>` : `${v} ✗ ไม่พอ`).join(" · ")}`,
      ok:`2^${n} = <b>${x.z}</b> ≥ ${need}${need === x.z ? " (พอดีเป๊ะ ใช้ได้เลย)" : `${x.z / 2 >= 4 ? ` ส่วน ${x.z / 2} ไม่พอ` : ""}`}`});
    S.push({tag:`① ขนาดวง · VLAN ${x.vlan}`, title:`หา Prefix ของ VLAN ${x.vlan}`, body:`<p>IP ยาว 32 bit ขนาดวง ${x.z} = 2^<b>${n}</b> แปลว่าใช้ ${n} bit เป็นส่วนของเครื่อง ที่เหลือเป็นส่วนของวง</p><p><code>prefix = 32 − n</code></p>`,
      ask:`32 − ${n} = ? (ตอบแบบ /xx)`, ans:"/" + x.pf, cell:[x.vlan, "pf"], ok:`32 − ${n} = <b>/${x.pf}</b>`});
    S.push({tag:`① ขนาดวง · VLAN ${x.vlan}`, title:`หา Subnet Mask ของ VLAN ${x.vlan}`, body:`<p>สามช่องแรกเป็น 255.255.255 เสมอ (เพราะ prefix ≥ 24) ช่องสุดท้ายใช้สูตรลัด</p><p><code>mask ช่องท้าย = 256 − ขนาดวง</code> → 256 − ${x.z}</p>`,
      ask:`Subnet mask = ?`, ans:maskOf(x.pf), cell:[x.vlan, "mask"], hint:`256 − ${x.z} = ${256 - x.z} → 255.255.255.${256 - x.z}`, ok:`256 − ${x.z} = ${256 - x.z} → <b>${maskOf(x.pf)}</b>`});
  });
  const big = sorted[0];
  S.push({tag:"② เรียงลำดับ", title:"วงไหนได้ IP ก่อน", body:`<p>กฎ VLSM: <b>ให้วงที่ใหญ่ที่สุดก่อน</b> แล้วไล่ไปหาเล็ก เพราะวงใหญ่ต้องเริ่มที่เลขที่หารขนาดตัวเองลงตัว ถ้าให้วงเล็กก่อน วงใหญ่จะไม่มีที่ลง</p>
    <p>ขนาดวงตอนนี้: ${d.map(x => `VLAN ${x.vlan} = ${x.z}`).join(" · ")}</p>${P.shuffled ? `<p>⚠️ ระวัง: ชุดนี้เลข VLAN <b>ไม่ได้</b>เรียงตามขนาด</p>` : ""}`,
    ask:"VLAN ไหนต้องได้ IP ก่อน (ตอบเลข VLAN)", ans:big.vlan, cell:null, ok:`VLAN <b>${big.vlan}</b> ใหญ่สุด (${big.z}) · ลำดับทั้งหมด: ${sorted.map(x => `VLAN ${x.vlan} (${x.z})`).join(" → ")}`, order:true});
  sorted.forEach((x, i) => {
    const prev = sorted[i - 1];
    S.push({tag:`③ ไล่วง · VLAN ${x.vlan}`, title:`Network Address ของ VLAN ${x.vlan}`, body: i === 0 ? `<p>วงแรกเริ่มที่จุดเริ่มของ /24 เลย คือ <b>.0</b></p>` : `<p>วงนี้เริ่ม<b>ต่อจาก broadcast ของวงก่อนหน้า</b> (VLAN ${prev.vlan} จบที่ .${prev.nt + prev.z - 1})</p><p><code>network = broadcast วงก่อน + 1</code></p>`,
      ask:`Network ของ VLAN ${x.vlan} = ? (พิมพ์ IP เต็ม หรือแค่เลขท้ายก็ได้)`, ans:pre + x.nt, cell:[x.vlan, "net"], hint: i ? `${prev.nt + prev.z - 1} + 1 = ${x.nt}` : "", ok:`<b>${pre}${x.nt}</b>${x.nt ? ` (เช็ก: ${x.nt} ÷ ${x.z} = ${x.nt / x.z} ลงตัว ✓)` : ""}`});
    S.push({tag:`③ ไล่วง · VLAN ${x.vlan}`, title:`Broadcast Address ของ VLAN ${x.vlan}`, body:`<p>Broadcast คือ IP ตัวสุดท้ายของวง วงนี้มี ${x.z} ตัว เริ่มที่ .${x.nt}</p><p><code>broadcast = network + ขนาดวง − 1</code> (ลบ 1 เพราะนับตัวแรกไปแล้ว)</p>`,
      ask:`Broadcast ของ VLAN ${x.vlan} = ?`, ans:pre + (x.nt + x.z - 1), cell:[x.vlan, "bc"], hint:`${x.nt} + ${x.z} − 1 = ${x.nt + x.z - 1}`, ok:`${x.nt} + ${x.z} − 1 = <b>${pre}${x.nt + x.z - 1}</b>`});
    S.push({tag:`③ ไล่วง · VLAN ${x.vlan}`, title:`Usable Range และ Gateway ของ VLAN ${x.vlan}`, body:`<p>IP ที่แจกให้เครื่องได้ = <b>ทุกตัวระหว่าง network กับ broadcast</b> → .${x.nt + 1} ถึง .${x.nt + x.z - 2}</p><p>โจทย์บอกให้ <b>IP ใช้งานได้ตัวแรกเป็น Default Gateway</b> → <code>gateway = network + 1</code></p>`,
      ask:`Gateway ของ VLAN ${x.vlan} = ?`, ans:pre + (x.nt + 1), cell:[x.vlan, "gw"], ok:`Gateway <b>${pre}${x.nt + 1}</b> · Usable <b>${pre}${x.nt + 1} – ${pre}${x.nt + x.z - 2}</b> (แจกได้ ${x.z - 2} ≥ ${x.h} เครื่อง ✓)`, fill:[x.vlan, "use"]});
  });
  const o = +last(P.ip);
  S.push({tag:"④ ข้อ 2", title:`IP ${P.ip} อยู่ VLAN ไหน`, body:`<p>ดูแค่เลขท้าย <b>.${o}</b> แล้วเทียบกับช่วงของแต่ละวงในตาราง (network ถึง broadcast)</p><p>${sorted.map(x => `VLAN ${x.vlan}: .${x.nt} – .${x.nt + x.z - 1}`).join("<br>")}</p>`,
    ask:"ตอบเลข VLAN", ans:P.tgt.vlan, cell:null, ok:`.${o} อยู่ระหว่าง .${P.tgt.nt} – .${P.tgt.nt + P.tgt.z - 1} → <b>VLAN ${P.tgt.vlan}</b>`});
  S.push({tag:"④ ข้อ 3", title:"เหลือ IP ช่วงไหนว่าง", body:`<p>วงสุดท้ายที่แจกไปจบที่ broadcast <b>.${P.cur - 1}</b> ที่เหลือหลังจากนั้นจนถึง .255 คือยังว่าง</p>`,
    ask:"IP ว่างตัวแรกคืออะไร", ans:pre + P.cur, cell:null, ok:`ว่าง <b>${pre}${P.cur} – ${pre}255</b> (${256 - P.cur} เบอร์) ← ตอบแบบนี้ในข้อสอบ`});
  S.push({tag:"เสร็จ", title:"ทำครบแล้ว 🎉", body:`<p>สรุปวิธีทั้งหมดในบรรทัดเดียว: <b>+2 → 2ⁿ → prefix = 32 − n → mask = 256 − 2ⁿ → เรียงใหญ่ไปเล็ก → network ต่อจาก broadcast เดิม + 1 → broadcast = network + ขนาด − 1 → gateway = network + 1</b></p><p>ลองทำชุดใหม่แบบไม่ดูคำใบ้ หรือไปทำชุดนี้บนกระดาษจริงในหน้าข้อสอบเสมือนจริงได้</p>`, end:true});
  return S;
}
function renderLearn(codeArg){

  const match = (v, a) => { const x = norm(v); if (!x) return false; const y = norm(a); if (x === y) return true; return /^\d+\.\d+\.\d+\.\d+$/.test(String(a)) && x === String(a).split(".")[3]; };
  const COLS = [["need", "+2"], ["z", "ขนาดวง"], ["pf", "Prefix"], ["mask", "Subnet Mask"], ["net", "Network"], ["use", "Usable Range"], ["bc", "Broadcast"], ["gw", "Gateway"]];
  const cellVal = (x, k) => ({need: x.h + 2, z: x.z, pf: "/" + x.pf, mask: maskOf(x.pf), net: P.pre + x.nt, use: `${P.pre}${x.nt + 1} – ${P.pre}${x.nt + x.z - 2}`, bc: P.pre + (x.nt + x.z - 1), gw: P.pre + (x.nt + 1)})[k];

      return `<td class="${f ? "f" : "e"}${cur === key ? " now" : ""}">${f ? esc(cellVal(x, k)) : (cur === key ? "?" : "·")}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`;
  };
  const draw = () => {

        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="lnew">สุ่มชุดใหม่</button><a class="btn" href="#paper-${code}" style="text-decoration:none;color:inherit">ดูชุดนี้แบบกระดาษ</a></div></div>
      <div class="lrnProg"><span>ขั้น ${i + 1}/${S.length}</span><span class="meter"><i style="width:${(i + 1) / S.length * 100}%"></i></span></div>
      <div class="lrnCard" style="--c1:var(--mint)"><span class="tag">${st.tag}</span><h3>${st.title}</h3><div class="body">${st.body}</div>
        ${st.ans !== undefined ? `<div class="ask">${st.ask}</div>
          <div class="lrnRow"><input class="cin" id="lin" autocomplete="off" spellcheck="false" ${done[i] ? `value="${esc(String(st.ans))}" disabled` : ""}><button class="btn pri" id="lchk" ${done[i] ? "hidden" : ""}>ตรวจ</button>${st.hint && !done[i] ? `<button class="btn" id="lhint">คำใบ้</button>` : ""}${!done[i] ? `<button class="btn" id="lshow">ดูคำตอบ</button>` : ""}</div>
          <div id="lfb">${done[i] ? `<div class="lrnFb ok"><span class="h">✓ </span>${st.ok}</div>` : ""}</div>` : ""}
        <div class="lrnNav"><button class="btn" id="lprev" ${i ? "" : "disabled"}>← ย้อน</button>${st.end ? `<button class="btn pri" id="lagain">ทำชุดใหม่</button>` : `<button class="btn pri" id="lnext" ${solved ? "" : "disabled"}>ถัดไป →</button>`}</div></div>
      <div class="phead" style="margin:4px 0 8px"><div><h1 style="font-size:18px">ตารางคำตอบ (เติมขึ้นเรื่อยๆ)</h1></div></div>${table()}
      <p class="lrnSide">ช่องสีเหลือง = ช่องที่กำลังหาอยู่ · ตารางจริงในข้อสอบมีแค่ Prefix ถึง Gateway ส่วน "+2" และ "ขนาดวง" เป็นทดในกระดาษ</p>`;
    const inp = document.getElementById("lin"), fb = document.getElementById("lfb");
    const pass = (shown) => { done[i] = true; fb.innerHTML = `<div class="lrnFb ok"><span class="h">${shown ? "คำตอบ: " : "✓ ถูกต้อง! "}</span>${st.ok}</div>`; if (!shown) markDay(); draw(); };
    if (inp && !done[i]){
      inp.focus({preventScroll:true});
      inp.onkeydown = e => { if (e.key === "Enter") document.getElementById("lchk").click(); };
      document.getElementById("lchk").onclick = () => {
        if (match(inp.value, st.ans)) pass(false);
        else fb.innerHTML = `<div class="lrnFb no"><span class="h">ยังไม่ใช่</span> ลองอีกครั้ง${st.hint ? " หรือกดคำใบ้" : ""}</div>`;
      };
      const hb = document.getElementById("lhint"); if (hb) hb.onclick = () => { fb.innerHTML = `<div class="lrnFb no" style="background:color-mix(in srgb,var(--sun) 14%,var(--surface));border-color:color-mix(in srgb,var(--sun) 40%,transparent)"><span class="h" style="color:inherit">💡 </span>${st.hint}</div>`; };
      document.getElementById("lshow").onclick = () => pass(true);
    }
    const nx = document.getElementById("lnext"); if (nx){ nx.onclick = () => { i++; draw(); }; if (solved && !inp) nx.focus({preventScroll:true}); }
    if (done[i] && nx) nx.focus({preventScroll:true});
    document.getElementById("lprev").onclick = () => { if (i){ i--; draw(); } };
    const again = () => { code = Math.floor(1000 + Math.random() * 9000); history.replaceState(null, "", "#learn-" + code); P = genPaper(code); S = buildLesson(P); i = 0; done = {}; draw(); };
    document.getElementById("lnew").onclick = again;
    const ag = document.getElementById("lagain"); if (ag) ag.onclick = again;
  };
  draw();
  scrollTo(0, 0);
}

/* ---------- study timer ---------- */
const T = {mode:25, left:25 * 60, end:0, run:false, h:null};
const timer = document.getElementById("timer"), clock = document.getElementById("clock"), tlbl = document.getElementById("tlbl"), tgo = document.getElementById("tgo");
const fmt = sec => String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
function tick(){
  if (T.run){ T.left = Math.max(0, Math.round((T.end - Date.now()) / 1000)); }
  clock.textContent = fmt(T.left);
  tlbl.textContent = T.run ? fmt(T.left) : "จับเวลา";
  document.getElementById("tbtn").classList.toggle("on", T.run);
  if (T.run && T.left === 0){
    T.run = false; clearInterval(T.h); tgo.textContent = "เริ่ม";
    clock.classList.remove("ding"); void clock.offsetWidth; clock.classList.add("ding");
    setMode(T.mode === 25 ? 5 : 25); timer.classList.add("show");
    document.title = T.mode === 5 ? "หมดเวลาอ่าน พักได้!" : "หมดเวลาพัก กลับมาอ่าน!";
    setTimeout(() => document.title = "สมุดติว DST ปี 2", 8000);
  }
}
function setMode(m){ T.mode = m; T.left = m * 60; T.run = false; clearInterval(T.h); tgo.textContent = "เริ่ม"; timer.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.m === m)); tick(); }
timer.querySelectorAll(".modes button").forEach(b => b.onclick = () => setMode(+b.dataset.m));
tgo.onclick = () => {
  if (T.run){ T.run = false; clearInterval(T.h); tgo.textContent = "ทำต่อ"; }
  else { T.run = true; T.end = Date.now() + T.left * 1000; T.h = setInterval(tick, 500); tgo.textContent = "หยุด"; }
  tick();
};
document.getElementById("treset").onclick = () => setMode(T.mode);
document.getElementById("tbtn").onclick = () => timer.classList.toggle("show");
document.getElementById("tclose").onclick = () => timer.classList.remove("show");

/* ---------- theme toggle ---------- */
const THEMES = ["auto","light","dark"], TH_IC = {auto:"🌓", light:"☀", dark:"☾"}, TH_LBL = {auto:"ธีมตามเครื่อง", light:"ธีมสว่าง", dark:"ธีมมืด"};
function applyTheme(t){
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  document.getElementById("thIc").textContent = TH_IC[t];
  document.getElementById("theme").setAttribute("aria-label", TH_LBL[t] + " (กดเพื่อสลับ)");
  document.getElementById("theme").title = TH_LBL[t];
}
let theme = store.get("dst-theme", "auto"); applyTheme(theme);
document.getElementById("theme").onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; store.set("dst-theme", theme); applyTheme(theme); };

function onScroll(){
  const h = document.documentElement, max = h.scrollHeight - innerHeight;
  readbar.style.width = (document.getElementById("doc") && max > 0 ? (scrollY / max * 100) : 0) + "%";
  fab.classList.toggle("show", scrollY > 600);
}
addEventListener("scroll", onScroll, {passive:true});
fab.onclick = () => scrollTo({top:0, behavior: reduce ? "auto" : "smooth"});

function route(){
  const h = location.hash.slice(1);
  readbar.style.width = "0";
  document.querySelectorAll(".tool[data-t]").forEach(a => a.classList.toggle("on", a.dataset.t === h || (a.dataset.t === "code" && h.startsWith("code-"))));
  if (!h) return renderHome();
  if (h === "wrong") return renderWrong();
  if (h === "search") return renderSearch();
  if (h === "cards") return renderCards();
  if (h === "exam") return renderExam();
  if (h === "calc") return renderCalc();
  if (h === "learn" || /^learn-\d+$/.test(h)) return renderLearn(h.startsWith("learn-") ? +h.slice(6) : 0);
  if (h === "paper" || /^paper-\d+$/.test(h)) return renderPaper(h.startsWith("paper-") ? +h.slice(6) : 0);
  if (h === "code") return renderCodeList();
  if (h.startsWith("code-")) return renderCode(h.slice(5));
  const subj = SUBJECTS.find(s => s.id === h);
  if (subj){ scrollTo(0, 0); return renderSubject(subj); }
  const m = h.match(/-(quick|quiz)$/), mode = m ? m[1] : "detail", hit = findChap(m ? h.slice(0, -m[0].length) : h);
  if (hit && hit.c.st === "ready") return renderChapter(hit, mode);
  if (hit) return renderSubject(hit.s);
  renderHome();
}
addEventListener("hashchange", route);
updWrongCount();
loadCode().catch(() => {});
route();
</script>
